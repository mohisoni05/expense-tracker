<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTrack - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <nav class="dashboard-nav">
            <div class="logo">SmartTrack</div>
            <div class="user-info">
                <span id="userEmail"></span>
                <button class="btn btn-outline" id="logoutBtn">Log Out</button>
            </div>
        </nav>

        <main class="dashboard-content">
            <div class="summary-cards">
                <div class="summary-card">
                    <h3>Total Spent</h3>
                    <p id="totalSpent">$0.00</p>
                </div>
                <div class="summary-card">
                    <h3>Monthly Budget</h3>
                    <p id="monthlyBudget">$0.00</p>
                </div>
                <div class="summary-card">
                    <h3>Remaining</h3>
                    <p id="remaining">$0.00</p>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="expense-form-container">
                    <h2>Add New Expense</h2>
                    <form id="expenseForm" class="expense-form">
                        <div class="form-group">
                            <label for="expenseTitle">Title</label>
                            <input type="text" id="expenseTitle" required placeholder="Enter expense title">
                        </div>

                        <div class="form-group">
                            <label for="expenseAmount">Amount</label>
                            <input type="number" id="expenseAmount" required min="0" step="0.01" placeholder="Enter amount">
                        </div>

                        <div class="form-group">
                            <label for="expenseCategory">Category</label>
                            <select id="expenseCategory" required>
                                <option value="">Select a category</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Rent">Rent</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="expenseDate">Date</label>
                            <input type="date" id="expenseDate" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full">Add Expense</button>
                    </form>
                </div>

                <div class="expense-list-container">
                    <h2>Recent Expenses</h2>
                    <div id="expenseList" class="expense-list"></div>
                </div>

                <div class="chart-container">
                    <h2>Expense Breakdown</h2>
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
        <div class="spinner"></div>
    </div>

    <div id="errorContainer" class="error-container" style="display: none;"></div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
