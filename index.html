<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTrack - Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="landing-container">
        <nav class="navbar">
            <div class="logo">SmartTrack</div>
            <div class="nav-buttons">
                <button class="btn btn-outline" onclick="location.href='auth.html?mode=login'">Log In</button>
                <button class="btn btn-primary" onclick="location.href='auth.html?mode=signup'">Sign Up</button>
            </div>
        </nav>

        <main class="hero-section">
            <div class="hero-content">
                <h1>Track Your Expenses Smartly</h1>
                <p class="hero-text">Take control of your finances with SmartTrack. 
                   Monitor your spending, set budgets, and make informed financial decisions.</p>
                <div class="cta-buttons">
                    <button class="btn btn-primary btn-large" onclick="location.href='auth.html?mode=signup'">Get Started</button>
                    <button class="btn btn-outline btn-large" onclick="location.href='auth.html?mode=login'">Already have an account?</button>
                </div>
            </div>
            <div class="hero-image">
                <img src="dashboard-preview.png" alt="SmartTrack Dashboard Preview">
            </div>
        </main>
    </div>
</body>
</html>
